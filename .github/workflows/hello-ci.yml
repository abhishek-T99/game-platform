name: hello-ci
on:
  push:
    paths:
      - "services/hello/**"
      - ".github/workflows/hello-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: services/hello
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
      - name: Run tests
        working-directory: services/hello
        env:
          DATABASE_URL: "sqlite:///test.db"
        run: pytest -q
      - name: Build image
        run: docker build -t hello:ci services/hello
